<title>Agent Runs (moved)</title>
<style>
/* Published over the old dashboard artifact, which stopped delivering
   chat wakes to the coordinator. Markup and style only: no script, no
   external assets. Same token pattern as index.html. */
:root{
  --body:-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;
  --bg:#f6f5f2;--card:#ffffff;--fg:#1d1c1a;--muted:#64605a;--line:#e4e1db;
  --accent:#2f5bd0;--on-accent:#ffffff;
  --shadow-2:0 0 0 1px rgba(28,25,23,.07),0 2px 4px rgba(28,25,23,.05),0 10px 24px -12px rgba(28,25,23,.18);
  color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#191817;--card:#22211f;--fg:#ecebe8;--muted:#a8a39b;--line:#363431;
  --accent:#8eaefc;--on-accent:#111318;
  --shadow-2:0 0 0 1px rgba(255,255,255,.09),0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#191817;--card:#22211f;--fg:#ecebe8;--muted:#a8a39b;--line:#363431;
  --accent:#8eaefc;--on-accent:#111318;
  --shadow-2:0 0 0 1px rgba(255,255,255,.09),0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme:dark}
body{margin:0;min-height:100vh;display:grid;place-items:center;
  background:var(--bg);color:var(--fg);font:15px/1.5 var(--body)}
.moved{box-sizing:border-box;width:min(440px,calc(100vw - 32px));padding:28px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  box-shadow:var(--shadow-2);text-align:center}
.moved h1{margin:0 0 20px;font-size:20px;font-weight:600;letter-spacing:-.01em}
.moved a{display:inline-block;padding:10px 18px;border-radius:999px;
  background:var(--accent);color:var(--on-accent);font-weight:600;text-decoration:none}
.moved a:hover{filter:brightness(1.08)}
.moved a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.moved p{margin:20px 0 0;color:var(--muted)}
</style>
<main class="moved">
  <h1>The agent dashboard has moved</h1>
  <a href="https://claude.ai/artifact/BWYCUWxJxBvG6MJvnsaqvn" target="_blank" rel="noopener noreferrer">Open the new dashboard</a>
  <p>Update your desktop launcher: open the new dashboard, ⋯ menu → Get desktop app.</p>
</main>
